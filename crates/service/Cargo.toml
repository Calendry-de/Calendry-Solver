[package]
name = "calendry-solver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# A library target as well as the binary. Without it nothing in this crate is
# reachable from an integration test: the conversion module's 21 rejection paths,
# the run registry's state machine and its idempotency dedup all sat behind `mod`
# declarations in a binary, and consequently none of them was tested.
[lib]
name = "calendry_solver"
path = "src/lib.rs"

[[bin]]
name = "calendry-solver"
path = "src/main.rs"

[dependencies]
calendry-solver-core.workspace = true
calendry-solver-proto.workspace = true

tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
