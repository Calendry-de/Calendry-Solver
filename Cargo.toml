[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/proto",
    "crates/service",
    "crates/gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "proprietary"

# Lints are configured here, once, and inherited by every crate via
# `[lints] workspace = true`. CI runs
# `cargo clippy --workspace --all-targets --all-features --locked -- -D warnings`,
# so anything below at `warn` is a hard failure there. Keeping the set in the
# workspace manifest rather than in per-crate `#![warn(...)]` attributes means a
# new crate inherits the policy instead of quietly opting out of it.
[workspace.lints.rust]
# The solver is pure computation over dense indices. There has never been a
# reason to reach for `unsafe`, and `forbid` means an `#[allow]` cannot
# reintroduce one locally.
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The performance lints the Apollo handbook singles out (ch. 3).
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
needless_pass_by_value = "warn"
inefficient_to_string = "warn"

# Correctness traps that are easy to introduce in a numeric hot loop.
cast_possible_truncation = "allow" # u32/usize index conversions are pervasive and checked by construction
float_cmp = "allow"                # objective comparisons are deliberate; see search::objectives_agree
missing_panics_doc = "allow"

# Hygiene the handbook asks for (ch. 1, 4, 8).
doc_markdown = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

[workspace.dependencies]
calendry-solver-core = { path = "crates/core" }
calendry-solver-proto = { path = "crates/proto" }

rayon = "1.12"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
insta = "1"
