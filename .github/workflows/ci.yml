name: CI

# The gate this repository did not have. Until now clippy ran only when a human
# typed it, and without `-D warnings` — so a warning was advice, not a failure.
#
# Every job that compiles goes through `.github/actions/rust-build-env`, which
# owns the proto submodule, the toolchain, `protoc` and the cache. See that file
# for why protoc is the part that bites: it is a build dependency nothing in
# Cargo.toml declares, so a workspace can be green on every developer machine and
# fail in CI on the first run.
#
# `fmt` is deliberately the exception — it parses, it does not compile, so it
# needs none of that and stays a fast first signal.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Fail on a warning from the compiler as well as from clippy, so a `warn`-level
  # lint in the workspace manifest is a real gate rather than a suggestion.
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-build-env
        with:
          components: clippy
          cache-key: clippy
      # --locked so a lockfile drift fails here rather than silently resolving
      # to a different dependency set than a developer has locally.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-build-env
        with:
          cache-key: test
      - run: cargo test --workspace --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-build-env
        with:
          cache-key: docs
      # A broken intra-doc link is the one documentation defect that rots
      # silently, because nothing else ever resolves those paths.
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  # The benchmark presets carry calibration assertions (saturation band, person
  # clique bound, and the closed-form-vs-measured agreement). They are only
  # meaningful in release, and only reproducible under a move budget — a
  # wall-clock-terminated run is legitimately non-deterministic.
  bench-smoke:
    name: bench smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-build-env
        with:
          cache-key: release
      - run: cargo run --release --locked -p calendry-solver-gen --bin bench -- small-school --moves 20000
